services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: recruitu
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - recruitu_pg:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
volumes:
  recruitu_pg:
